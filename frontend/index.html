<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Sideye review</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="reconnect-banner" class="banner hidden" role="alert">
      Connection to the review server lost — retrying…
    </div>
    <header>
      <h1>Sideye</h1>
      <span id="target-label"></span>
      <label id="round-label">
        Round
        <select id="round-select" disabled></select>
      </label>
    </header>
    <main>
      <section id="diff-pane"></section>
      <aside id="side-panel">
        <nav id="panel-tabs" aria-label="Review panel"></nav>
        <div id="panel-content"></div>
      </aside>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
